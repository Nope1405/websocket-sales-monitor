<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Embed Test</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at 20% 20%, #1e293b 0%, #0f172a 45%, #020617 100%);
        color: #e2e8f0;
      }

      .wrap {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 16px;
        padding: 16px;
      }

      .header {
        border: 1px solid #334155;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.85);
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .title {
        font-size: 18px;
        font-weight: 700;
      }

      .badge {
        border: 1px solid #22c55e66;
        background: #052e16;
        color: #86efac;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 600;
      }

      .frame-card {
        border: 1px solid #334155;
        border-radius: 12px;
        overflow: hidden;
        background: #0f172a;
        min-height: 70vh;
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: 70vh;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="title">Web local test nhung dashboard</div>
        <div class="badge">Nguon iframe: __DASHBOARD_URL__</div>
      </div>
      <div class="frame-card">
        <iframe src="__DASHBOARD_URL__" title="Embedded Sales Dashboard"></iframe>
      </div>
    </div>
  </body>
</html>
